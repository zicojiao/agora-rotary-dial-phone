allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  postcss: 8.5.18
  sharp: 0.35.0

# agora-rtm pins an older RTC peer even though the client toolkit requires
# >=4.23.4. This project verifies the installed 4.24.3 combination in CI.
peerDependencyRules:
  allowedVersions:
    "agora-rtm@2.2.3>agora-rtc-sdk-ng": 4.24.3
